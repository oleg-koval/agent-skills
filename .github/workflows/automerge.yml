name: Bot automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # GitHub Actions does not expose pull_request_review_thread, so recheck open
  # PRs periodically after a thread is resolved without another review event.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to re-evaluate
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr-number == '')
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.list.outputs.pr-numbers }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '[.[].number]')"
          printf 'pr-numbers=%s\n' "$prs" >> "$GITHUB_OUTPUT"

  retry:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.pr-numbers != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ matrix.pr-number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.discover.outputs.pr-numbers) }}
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: |
          merged_at="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt -q '.mergedAt // ""')"
          if [ -n "$merged_at" ]; then
            printf 'already-merged=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'already-merged=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ matrix.pr-number }}
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.already-merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: |
          pr_data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergedBy --jq '[.baseRefName, .mergedAt // "", .mergedBy.login // ""] | @tsv')"
          IFS=$'\t' read -r base_ref merged_at merged_by <<< "$pr_data"
          normalized_merged_by="${merged_by#app/}"
          if [ -n "$merged_at" ] && { [ "$normalized_merged_by" = "github-actions" ] || [ "$normalized_merged_by" = "github-actions[bot]" ]; }; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref"
          else
            echo "PR #$PR_NUMBER was not newly merged by this workflow (merged_by=${merged_by:-none}); no release dispatched."
          fi

  manual:
    if: github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ inputs.pr-number }}
      cancel-in-progress: false
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          merged_at="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt -q '.mergedAt // ""')"
          if [ -n "$merged_at" ]; then
            printf 'already-merged=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'already-merged=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ inputs.pr-number }}
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.already-merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          pr_data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergedBy --jq '[.baseRefName, .mergedAt // "", .mergedBy.login // ""] | @tsv')"
          IFS=$'\t' read -r base_ref merged_at merged_by <<< "$pr_data"
          normalized_merged_by="${merged_by#app/}"
          if [ -n "$merged_at" ] && { [ "$normalized_merged_by" = "github-actions" ] || [ "$normalized_merged_by" = "github-actions[bot]" ]; }; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref"
          else
            echo "PR #$PR_NUMBER was not newly merged by this workflow (merged_by=${merged_by:-none}); no release dispatched."
          fi

  automerge:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          merged_at="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt -q '.mergedAt // ""')"
          if [ -n "$merged_at" ]; then
            printf 'already-merged=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'already-merged=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.already-merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergedBy --jq '[.baseRefName, .mergedAt // "", .mergedBy.login // ""] | @tsv')"
          IFS=$'\t' read -r base_ref merged_at merged_by <<< "$pr_data"
          normalized_merged_by="${merged_by#app/}"
          if [ -n "$merged_at" ] && { [ "$normalized_merged_by" = "github-actions" ] || [ "$normalized_merged_by" = "github-actions[bot]" ]; }; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref"
          else
            echo "PR #$PR_NUMBER was not newly merged by this workflow (merged_by=${merged_by:-none}); no release dispatched."
          fi
