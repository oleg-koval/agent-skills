name: Bot automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # GitHub Actions does not expose pull_request_review_thread, so recheck open
  # PRs and release-pending merged PRs periodically after a thread is resolved.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to re-evaluate
        required: false
        type: string
      pr-numbers:
        description: JSON array of pull request numbers for a retry batch
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: false

env:
  RELEASE_PENDING_LABEL: release-dispatch-pending

jobs:
  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.pr-number == '')
    runs-on: ubuntu-latest
    outputs:
      pr-numbers: ${{ steps.list.outputs.pr-numbers }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ inputs.pr-numbers }}
          DEFAULT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "$PR_NUMBERS" ]; then
            prs="$(jq -ce 'if type == "array" and all(.[]; type == "number") then . else error("pr-numbers must be a JSON array of numbers") end' <<< "$PR_NUMBERS")"
          else
            open_prs="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
                jq -s -c 'add | map(select(.draft == false and (.user.login | IN("dependabot[bot]", "snyk-bot", "renovate[bot]", "oleg-koval-fleet[bot]", "oleg-koval"))) | .number)'
            )"
            pending_prs="$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&labels=release-dispatch-pending&per_page=100" |
                jq -s -c 'add | map(select(.pull_request != null) | .number)'
            )"
            prs="$(jq -n -c --argjson open "$open_prs" --argjson pending "$pending_prs" '$open + $pending | unique | sort')"
          fi

          total="$(jq -er 'length' <<< "$prs")"
          printf 'pr-numbers=%s\n' "$(jq -c '.[0:256]' <<< "$prs")" >> "$GITHUB_OUTPUT"

          for ((offset = 256; offset < total; offset += 256)); do
            batch="$(jq -c --argjson start "$offset" --argjson end_index "$((offset + 256))" '.[$start:$end_index]' <<< "$prs")"
            gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_REF" -f "pr-numbers=$batch"
          done

  retry:
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.pr-numbers != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: automerge-${{ matrix.pr-number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pr-number: ${{ fromJSON(needs.discover.outputs.pr-numbers) }}
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
          EVENT_ACTION: ''
          EVENT_MERGED: 'false'
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt,mergeCommit,mergedBy,baseRefName,labels)"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          pending_marker="$(jq -r --arg label "$RELEASE_PENDING_LABEL" 'if ([.labels[].name] | index($label)) == null then "false" else "true" end' <<< "$pr_json")"
          printf 'already-merged=%s\n' "$([ -n "$merged_at" ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          printf 'release-pending=%s\n' "$([ "$pending_marker" = true ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          if [ -z "$merged_at" ] || [ "$pending_marker" = true ]; then
            printf 'should-dispatch=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-dispatch=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval-fleet[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ matrix.pr-number }}
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergeCommit,mergedBy)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          merge_sha="$(jq -r '.mergeCommit.oid // ""' <<< "$pr_json")"
          merged_by="$(jq -r '.mergedBy.login // ""' <<< "$pr_json")"
          normalized_merged_by="${merged_by#app/}"
          if [ -z "$merged_at" ] || { [ "$normalized_merged_by" != "github-actions" ] && [ "$normalized_merged_by" != "github-actions[bot]" ]; }; then
            echo "PR #$PR_NUMBER was not merged by GitHub Actions; no release dispatched."
            exit 0
          fi
          gh label create "$RELEASE_PENDING_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description 'Bot merge awaiting CI release dispatch' --force >/dev/null
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$RELEASE_PENDING_LABEL" >/dev/null
          release_title="CI and release ($merge_sha)"
          existing_runs="$(
            gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci-release.yml/runs" \
              -f event=workflow_dispatch -f "branch=$base_ref" -f per_page=100 |
              jq -s --arg title "$release_title" '[.[].workflow_runs[] | select(.display_title == $title)] | length'
          )"
          if [ "$existing_runs" -eq 0 ]; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref" \
              -f "release-key=$merge_sha"
          else
            echo "Release workflow already accepted for merge $merge_sha."
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$RELEASE_PENDING_LABEL" >/dev/null

  manual:
    if: github.event_name == 'workflow_dispatch' && inputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EVENT_ACTION: ''
          EVENT_MERGED: 'false'
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt,mergeCommit,mergedBy,baseRefName,labels)"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          pending_marker="$(jq -r --arg label "$RELEASE_PENDING_LABEL" 'if ([.labels[].name] | index($label)) == null then "false" else "true" end' <<< "$pr_json")"
          printf 'already-merged=%s\n' "$([ -n "$merged_at" ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          printf 'release-pending=%s\n' "$([ "$pending_marker" = true ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          if [ -z "$merged_at" ] || [ "$pending_marker" = true ]; then
            printf 'should-dispatch=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-dispatch=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval-fleet[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
          pr-number: ${{ inputs.pr-number }}
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergeCommit,mergedBy)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          merge_sha="$(jq -r '.mergeCommit.oid // ""' <<< "$pr_json")"
          merged_by="$(jq -r '.mergedBy.login // ""' <<< "$pr_json")"
          normalized_merged_by="${merged_by#app/}"
          if [ -z "$merged_at" ] || { [ "$normalized_merged_by" != "github-actions" ] && [ "$normalized_merged_by" != "github-actions[bot]" ]; }; then
            echo "PR #$PR_NUMBER was not merged by GitHub Actions; no release dispatched."
            exit 0
          fi
          gh label create "$RELEASE_PENDING_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description 'Bot merge awaiting CI release dispatch' --force >/dev/null
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$RELEASE_PENDING_LABEL" >/dev/null
          release_title="CI and release ($merge_sha)"
          existing_runs="$(
            gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci-release.yml/runs" \
              -f event=workflow_dispatch -f "branch=$base_ref" -f per_page=100 |
              jq -s --arg title "$release_title" '[.[].workflow_runs[] | select(.display_title == $title)] | length'
          )"
          if [ "$existing_runs" -eq 0 ]; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref" \
              -f "release-key=$merge_sha"
          else
            echo "Release workflow already accepted for merge $merge_sha."
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$RELEASE_PENDING_LABEL" >/dev/null

  automerge:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Record merge state before evaluation
        id: premerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergedAt,mergeCommit,mergedBy,baseRefName,labels)"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          pending_marker="$(jq -r --arg label "$RELEASE_PENDING_LABEL" 'if ([.labels[].name] | index($label)) == null then "false" else "true" end' <<< "$pr_json")"
          printf 'already-merged=%s\n' "$([ -n "$merged_at" ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          printf 'release-pending=%s\n' "$([ "$pending_marker" = true ] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          if [ -z "$merged_at" ] || [ "$pending_marker" = true ] || { [ "$EVENT_ACTION" = closed ] && [ "$EVENT_MERGED" = true ]; }; then
            printf 'should-dispatch=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'should-dispatch=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          bot-logins: dependabot[bot],snyk-bot,renovate[bot],oleg-koval-fleet[bot],oleg-koval
          maintainer-handles: oleg-koval
          merge-method: squash
      - name: Dispatch release after a newly completed merge
        if: steps.premerge.outputs.should-dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,mergedAt,mergeCommit,mergedBy)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          merged_at="$(jq -r '.mergedAt // ""' <<< "$pr_json")"
          merge_sha="$(jq -r '.mergeCommit.oid // ""' <<< "$pr_json")"
          merged_by="$(jq -r '.mergedBy.login // ""' <<< "$pr_json")"
          normalized_merged_by="${merged_by#app/}"
          if [ -z "$merged_at" ] || { [ "$normalized_merged_by" != "github-actions" ] && [ "$normalized_merged_by" != "github-actions[bot]" ]; }; then
            echo "PR #$PR_NUMBER was not merged by GitHub Actions; no release dispatched."
            exit 0
          fi
          gh label create "$RELEASE_PENDING_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description 'Bot merge awaiting CI release dispatch' --force >/dev/null
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$RELEASE_PENDING_LABEL" >/dev/null
          release_title="CI and release ($merge_sha)"
          existing_runs="$(
            gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci-release.yml/runs" \
              -f event=workflow_dispatch -f "branch=$base_ref" -f per_page=100 |
              jq -s --arg title "$release_title" '[.[].workflow_runs[] | select(.display_title == $title)] | length'
          )"
          if [ "$existing_runs" -eq 0 ]; then
            gh workflow run ci-release.yml --repo "$GITHUB_REPOSITORY" --ref "$base_ref" \
              -f "release-key=$merge_sha"
          else
            echo "Release workflow already accepted for merge $merge_sha."
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$RELEASE_PENDING_LABEL" >/dev/null
